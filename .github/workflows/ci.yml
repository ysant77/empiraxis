name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"

jobs:
  hygiene:
    name: branch and commit hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Branch follows <type>/<kebab-name>
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern='^(feat|fix|chore|docs|refactor|test|ci|perf|release)/[a-z0-9]+(-[a-z0-9]+)*$'
          if ! [[ "$BRANCH" =~ $pattern ]]; then
            echo "::error::branch '$BRANCH' does not match <type>/<kebab-name>"
            exit 1
          fi
      - name: Commits carry no co-author trailers
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          if git log --format=%B "$RANGE" | grep -qiE '^[[:space:]]*co-authored-by:'; then
            echo "::error::remove co-author trailers from the pull request commits"
            exit 1
          fi

  quality:
    name: lint, types, size, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the m5-evidence-4 reproduction test reads its pinned source commit
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Size limits (500 lines per file, 50 per function)
        run: uv run python scripts/check_limits.py src tests scripts
      - name: Pytest with 85% coverage gate
        run: uv run pytest

  supply-chain:
    name: dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Audit runtime and extra dependencies
        run: |
          uv export --no-hashes --no-dev --no-emit-project --all-extras > requirements.audit.txt
          uvx pip-audit --strict -r requirements.audit.txt
      # The gitleaks action scans only the pushed range, and fails when that range's base
      # is gone (for example after a history rewrite). Scan every commit on every ref.
      - name: Scan the full Git history for secrets
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/${archive}" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 --log-opts="--all" .
