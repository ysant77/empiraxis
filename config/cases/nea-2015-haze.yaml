# The existing, working investigation expressed as a case. The asset is read from the
# pinned manifest, so its hash cannot drift from data/nea.
case:
  case_id: nea-2015-haze
  title: Singapore regional PM2.5 during the 2015 haze episode
  question: Which NEA region recorded the highest hourly PM2.5 in September and October 2015?
  area:
    area_id: nea-all-regions
    name: NEA reporting regions (areas, not stations)
    regions: [north, south, east, west, central]
  period:
    start: "2015-09-01T00:00:00+08:00"
    end: "2015-11-01T00:00:00+08:00"
    local_zone: Asia/Singapore
  variable: air_pollution_observation
  asset_ids: [nea-historical-1hr-pm25]
  method_id: nea_hourly_episode
  status: active
assets:
  - from_manifest: data/nea/manifest.json
