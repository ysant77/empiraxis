case:
  case_id: kalimantan-2015-burned-area
  title: Mapped burned area, Central Kalimantan, September-October 2015
  question: How much area did MODIS map as burned in the study area in September and October 2015?
  area:
    area_id: central-kalimantan-draft
    name: Central Kalimantan draft box (Sebangau / Palangka Raya peatlands)
    bbox: {min_lon: 113.8, min_lat: -3.2, max_lon: 114.8, max_lat: -2.0}
  period:  # MCD64A1 months are UTC calendar months; labels use local time (WIB)
    start: "2015-09-01T00:00:00Z"
    end: "2015-11-01T00:00:00Z"
    local_zone: Asia/Jakarta
  variable: burned_area
  asset_ids: [mcd64a1-061-kalimantan-2015, firms-modis-sp-kalimantan-2015]
  method_id: mcd64a1_burned_area
  notes: FIRMS detections are corroborating context only; they never become burned area.
assets:
  - asset_id: mcd64a1-061-kalimantan-2015
    product: MODIS/061/MCD64A1
    version: "6.1"
    provider: NASA LP DAAC (via Google Earth Engine)
    variable: burned_area
    units: BurnDate (day of year); area computed in ha
    licence: NASA Earth science data, no restrictions on use
    licence_url: https://www.earthdata.nasa.gov/engage/open-data-services-software-policies/data-use-guidance
    url: https://developers.google.com/earth-engine/datasets/catalog/MODIS_061_MCD64A1
    availability: registered_not_downloaded
    crs: SR-ORG:6974
    resolution_m: 463.3127
    coverage: {start: "2015-09-01T00:00:00Z", end: "2015-11-01T00:00:00Z", local_zone: UTC}
    extent: {min_lon: 113.8, min_lat: -3.2, max_lon: 114.8, max_lat: -2.0}
    quality_policy: QA bits per the MCD64A1 C6.1 user guide; unmapped and water pixels excluded
    limitations:
      - Mapped burned area at 500 m; not destroyed trees or forest loss.
  - asset_id: firms-modis-sp-kalimantan-2015
    product: FIRMS/MODIS_SP
    version: Collection 6.1 standard processing
    provider: NASA FIRMS
    variable: active_fire
    units: detections
    licence: NASA Earth science data, no restrictions on use
    licence_url: https://www.earthdata.nasa.gov/engage/open-data-services-software-policies/data-use-guidance
    url: https://firms.modaps.eosdis.nasa.gov/download/
    availability: registered_not_downloaded
    crs: EPSG:4326
    coverage: {start: "2015-09-01T00:00:00Z", end: "2015-11-01T00:00:00Z", local_zone: UTC}
    extent: {min_lon: 113.8, min_lat: -3.2, max_lon: 114.8, max_lat: -2.0}
    limitations:
      - A detection is a thermal anomaly at overpass time, not a fire perimeter or area.
