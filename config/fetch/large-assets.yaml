# Large assets a request may name, at exact pinned revisions. Being listed grants nothing: a
# person still approves each transfer. Add an entry only with a human decision.
assets:
  prithvi-burnscars-weights:
    need: Pretrained burn-scar weights for one reproduction inference on one published HLS chip (Level A). No fine-tuning, no distillation and no new download; the pinned file is local.
    asset: Prithvi-EO-2.0-300M-BurnScars weights (revision a3f2c410)
    url: https://huggingface.co/ibm-nasa-geospatial/Prithvi-EO-2.0-300M-BurnScars/resolve/a3f2c410e45b8ac7417976614528a872f024d831/Prithvi_EO_V2_300M_BurnScars.pt
    max_bytes: 1297798380
    sha256: 0c5f9334be9a75c9006387ab8f3dc05a55ea7fb5ef7956717316be57c62954d3
    content_types: [application/octet-stream]
    license_terms: Apache-2.0, as stated on the model card
  hls-burn-scars-chips:
    need: One labelled six-band HLS chip and its mask, the only input that fits the Prithvi burn-scar weights, for one reproduction inference (Level A). The pinned archive is local.
    asset: HLS Burn Scars dataset (revision 1864285e)
    url: https://huggingface.co/datasets/ibm-nasa-geospatial/hls_burn_scars/resolve/1864285e25010d346a842e4f068b1a1d4248ed6d/hls_burn_scars.tar.gz
    max_bytes: 2645552531
    sha256: 4e6f99a75cb2c500547b20662a15cbd531dc421376f815e91846ea542798e8e6
    content_types: [application/gzip, application/octet-stream]
    license_terms: CC-BY-4.0, as stated on the dataset card at this revision
  nea-pm25-history:
    need: Up to three days of official NEA hourly PM2.5 from the data.gov.sg API, to check the local historical file and its clock labels before modelling. Dates come from the run and stay before the sealed test period.
    asset: NEA hourly regional PM2.5, data.gov.sg API
    url: https://api-open.data.gov.sg/v2/real-time/api/pm25
    max_bytes: 1000000
    sha256: null
    content_types: [application/json]
    license_terms: Singapore Open Data Licence v1.0
