# Meta open-weight model endpoints. Fill hosted values from each provider dashboard; do not guess.
# API keys come from the named environment variables, never from this file.
providers:
  - name: local-glimmer
    kind: local
    base_url: http://127.0.0.1:8080/v1
    model: muse-glimmer-30B            # alias passed to llama-server with -a
    logical_model: muse-glimmer-30b
    timeout_seconds: 900
    usd_per_mtok_input: 0.0            # local inference; energy and hardware are not priced here
    usd_per_mtok_output: 0.0
    price_source: local hardware, not billed
    extra_body:
      chat_template_kwargs: {reasoning_strength: medium}

  - name: local-llama-guard
    kind: local
    api: ollama_raw                       # raw prompt, so the EarthLab policy is not re-templated
    base_url: http://127.0.0.1:11434
    model: earthlab-guard                 # ollama create earthlab-guard -f config/ollama/earthlab-guard.Modelfile
    logical_model: llama-guard-3-8b
    timeout_seconds: 120
    usd_per_mtok_input: 0.0
    usd_per_mtok_output: 0.0
    price_source: local hardware, not billed

  - name: lan-windows-glimmer
    kind: lan
    base_url: http://192.168.1.50:8080/v1   # replace with the Windows node LAN address
    model: muse-glimmer-30B
    logical_model: muse-glimmer-30b
    timeout_seconds: 1800
    usd_per_mtok_input: 0.0
    usd_per_mtok_output: 0.0
    price_source: local hardware, not billed
    extra_body:
      chat_template_kwargs: {reasoning_strength: medium}
    enabled: false

  - name: baseten-spark-open
    kind: hosted
    base_url: https://inference.baseten.co/v1
    model: meta-models/muse-spark-open   # hackathon model ID from the participant guide
    logical_model: muse-spark-open
    api_key_env: BASETEN_API_KEY
    enabled: false                     # enable after credits arrive and a probe passes

  - name: fireworks-spark-open
    kind: hosted
    base_url: https://api.fireworks.ai/inference/v1
    model: REPLACE_WITH_FIREWORKS_MODEL_ID
    logical_model: muse-spark-open
    api_key_env: FIREWORKS_API_KEY
    enabled: false

  - name: modal-spark-open
    kind: hosted
    base_url: https://REPLACE-WITH-MODAL-ENDPOINT.modal.run/v1
    model: REPLACE_WITH_MODAL_MODEL_ID
    logical_model: muse-spark-open
    api_key_env: MODAL_API_KEY
    enabled: false

  # Benchmark roster (docs/benchmark-matrix-protocol.md). Small models run on a second
  # llama-server on port 8081. They stay disabled until the model passes a preflight.
  - name: local-llama-3-1-8b
    kind: local
    base_url: http://127.0.0.1:8081/v1
    model: meta-llama/Llama-3.1-8B-Instruct
    logical_model: llama-3.1-8b-instruct
    timeout_seconds: 600
    usd_per_mtok_input: 0.0
    usd_per_mtok_output: 0.0
    price_source: local hardware, not billed
    enabled: false

  - name: local-llama-3-2-3b
    kind: local
    base_url: http://127.0.0.1:8081/v1
    model: meta-llama/Llama-3.2-3B-Instruct
    logical_model: llama-3.2-3b-instruct
    timeout_seconds: 600
    usd_per_mtok_input: 0.0
    usd_per_mtok_output: 0.0
    price_source: local hardware, not billed
    enabled: true

  - name: local-qwen3-4b-2507
    kind: local
    base_url: http://127.0.0.1:8081/v1
    model: Qwen/Qwen3-4B-Instruct-2507
    logical_model: qwen3-4b-instruct-2507
    timeout_seconds: 600
    usd_per_mtok_input: 0.0
    usd_per_mtok_output: 0.0
    price_source: local hardware, not billed
    enabled: true
