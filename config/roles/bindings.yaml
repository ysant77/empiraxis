# Role and model bindings. Model names here are candidates. `roles` lists the roles a
# candidate may serve now; `planned_roles` lists roles it is only being evaluated for.
# A role needs an enabled candidate, and enabling needs a passed preflight and a checked
# licence.
# Only muse-glimmer is enabled: as the single investigator (orchestrator, implemented)
# and for the experimental PM and engineer workflow roles (live local runs recorded; see
# docs/model-registry.md). These roles stay experimental: each scenario has few live runs.
# Every other candidate is disabled until a human approves its download or endpoint.
schema_version: "1"
roles:
  product_manager:   {families: [meta-muse, meta-llama], status: experimental}
  orchestrator:      {families: [meta-muse, meta-llama], status: implemented}
  geospatial_engineer: {families: [meta-muse], status: experimental}
  data_specialist:   {families: [meta-muse, meta-llama, qwen, gemma], status: experimental}
  ml_engineer:       {families: [meta-muse, meta-llama, qwen, gemma], status: experimental}
  implementor:       {families: [meta-muse, meta-llama, qwen, gemma, mistral, deepseek], status: planned}
  qa_reviewer:       {families: [meta-muse, meta-llama], status: experimental}

candidates:
  - candidate_id: muse-glimmer
    family: meta-muse
    model_id: muse-glimmer-30B
    provider_id: local-glimmer
    roles: [orchestrator, product_manager, geospatial_engineer, data_specialist, ml_engineer, qa_reviewer]
    planned_roles: [implementor]
    license: Apache-2.0
    license_checked: true
    enabled: true
    preflight:
      checked_on: "2026-11-01"
      json_schema: pass
      tool_call: pass
      served_model: muse-glimmer-30B
      note: >-
        17 live local runs at the last two tested commits, in the orchestrator, PM and engineer roles
        with the guard on. Peak memory is not recorded here: the Mac reports system wired
        memory only (26.5 GB peak, with other programs open).

  - candidate_id: llama-3-2-3b
    family: meta-llama
    model_id: meta-llama/Llama-3.2-3B-Instruct
    provider_id: local-llama-3-2-3b
    roles: [data_specialist, ml_engineer, qa_reviewer]
    planned_roles: [product_manager]
    license: Llama 3.2 Community License
    license_checked: true  # owner accepted the licence in chat, 2026-11-01
    enabled: true
    preflight:
      checked_on: "2026-11-02"
      json_schema: pass
      tool_call: pass
      served_model: meta-llama/Llama-3.2-3B-Instruct
      peak_memory_gb: 7.25
      note: >-
        Served alone on port 8081 (llama-server --jinja, 16k context). JSON schema check passed.
        A scripted loop made prepare_data, then submit_note, then stopped. Wired memory is the
        system figure with Muse down. Specialist roles only: the PM seat was not tested.
        Critic seat (qa_reviewer, M4, 2026-11-03): listed for the experiment m4-het-v1 only. The
        seeded-fault test shows a weak critic: 4 of 10 cases usable, 0 of 5 faults detected,
        6 cases unusable after the schema correction. Its findings are advisory.

  - candidate_id: llama-3-1-8b
    family: meta-llama
    model_id: meta-llama/Llama-3.1-8B-Instruct
    provider_id: local-llama-3-1-8b
    planned_roles: [product_manager, data_specialist, ml_engineer]
    license: Llama 3.1 Community License
    license_checked: true  # owner accepted the licence in chat, 2026-11-01
    enabled: false
    preflight:
      checked_on: "2026-11-02"
      json_schema: pass
      tool_call: fail
      served_model: meta-llama/Llama-3.1-8B-Instruct
      peak_memory_gb: 10.15
      note: >-
        Failed. In a scripted tool loop the model wrote a stray ";" before the second tool call.
        The server rejected the call with HTTP 500. Stays disabled.

  - candidate_id: muse-spark-open
    family: meta-muse
    model_id: meta-models/muse-spark-open
    provider_id: baseten-spark-open
    planned_roles: [geospatial_engineer, implementor]
    license: verify on the model card before use
    license_checked: false
    enabled: false

  - candidate_id: qwen3-coder-30b-a3b
    family: qwen
    model_id: Qwen/Qwen3-Coder-30B-A3B-Instruct
    planned_roles: [implementor]
    license: Apache-2.0 (verify the exact revision)
    license_checked: false
    enabled: false

  - candidate_id: qwen3-4b-2507
    family: qwen
    model_id: Qwen/Qwen3-4B-Instruct-2507
    provider_id: local-qwen3-4b-2507
    roles: [data_specialist, ml_engineer]
    planned_roles: [implementor]
    license: Apache-2.0 (verify the exact revision)
    license_checked: true  # owner approved the Apache-2.0 download in chat, relayed 2026-11-01
    enabled: true
    preflight:
      checked_on: "2026-11-02"
      json_schema: pass
      tool_call: pass
      served_model: Qwen/Qwen3-4B-Instruct-2507
      peak_memory_gb: 8.29
      note: >-
        Served alone on port 8081 (llama-server --jinja, 16k context). JSON schema check passed.
        A scripted loop made prepare_data, then submit_note, then stopped. Wired memory is the
        system figure with Muse down. Specialist roles only: the PM seat was not tested.

  - candidate_id: gemma-3-4b-it
    family: gemma
    model_id: google/gemma-3-4b-it
    planned_roles: [implementor]
    license: Gemma Terms of Use (gated; acceptance required)
    license_checked: false
    enabled: false
