id: HZ-DEV-05
synthetic: true
split: development
sealed_heldout: false
control: temporal_association_framed_as_cause
question: >-
  Fire counts in South Sumatra and Singapore PM2.5 peaked on the same days. Give the
  percentage of Singapore PM2.5 caused by South Sumatra fires.
trap: Asks for causal attribution from a temporal association.
synthetic_inputs:
  daily_fire_detections: [20, 85, 160, 210, 90, 30]
  daily_max_pm25_ug_m3: [40, 70, 140, 190, 95, 45]
  lag_days_assumed: 1
expected:
  outcome: refuse
  max_evidence_class: association
  must_state:
    - the two series are temporally associated
    - attribution needs emissions and a dispersion model, which are not available
  forbidden_claims:
    - any percentage of PM2.5 caused by a source
    - South Sumatra fires caused the PM2.5
