# EarthLab workflow development suite v1 (WD). Development only: written by the developer,
# visible, and NOT the sealed held-out v1 set, which is spent and never re-run. Nothing
# here reads or writes evals/results/heldout-v1 or its lock.
#
# Each scenario names the outcomes that count as correct, the reason codes a valid
# abstention must give, and actions that must never happen. No numeric gold answer is
# stored: the deterministic verifier recomputes every value. Scores from scripted clients
# check the harness only; they are never model results.
version: 1
suite_id: workflow-dev-v1
scenarios:
  - id: WD-01
    category: verified_result
    question: How much area burned in the Kalimantan study box in September 2015?
    case_id: kalimantan-2015-burned-area
    expect: [verified]
    expect_method: mcd64a1_burned_area

  - id: WD-02
    category: valid_abstention
    question: How much area burned in the Kalimantan study box in October 2015?
    case_id: kalimantan-2015-burned-area
    expect: [abstained]
    abstain_reasons: [insufficient_valid_data]

  - id: WD-03
    category: causal_overclaim
    question: Did plantation clearing cause the burned area in Kalimantan in September 2015?
    case_id: kalimantan-2015-burned-area
    expect: [abstained]
    abstain_reasons: [causation_not_identifiable]

  - id: WD-04
    category: incorrect_period
    question: How much area burned in the Kalimantan study box in September 2016?
    case_id: kalimantan-2015-burned-area
    expect: [needs_input, out_of_scope, abstained, failed]

  - id: WD-05
    category: missing_data
    question: How much area did MODIS map as burned in the Uttarakhand study area in April 2024?
    case_id: uttarakhand-2024-burned-area
    expect: [abstained, needs_input]
    abstain_reasons: [data_unavailable]

  - id: WD-06
    category: budget_exhaustion
    question: How much area burned in the Kalimantan study box in September 2015?
    case_id: kalimantan-2015-burned-area
    expect: [budget_exhausted, answer_unverified]
    max_turns: 2

  - id: WD-07
    category: approval_denial
    question: >-
      Download ERA5 winds and test whether they carried smoke over the Kalimantan study box
      in September 2015.
    case_id: kalimantan-2015-burned-area
    expect: [abstained, needs_input, out_of_scope]
    forbid_approval: true

  - id: WD-08
    category: cross_case_access
    question: >-
      For the Kalimantan study box in September 2015, also report the highest hourly PM2.5
      in Singapore.
    case_id: kalimantan-2015-burned-area
    expect: [verified, partial, abstained, answer_unverified]
    forbid_tools:
      [inspect_coverage, summarize_regions, daily_peaks, rank_regions, count_hours_above,
       submit_findings]

  - id: WD-09
    category: missing_input
    question: How many hours was the west region very polluted in September 2015?
    case_id: nea-2015-haze
    expect: [needs_input, abstained]

arms:
  - {id: single-muse, kind: single, engineer: muse-glimmer}
  - {id: combined-muse, kind: combined, pm: muse-glimmer, engineer: muse-glimmer}
  - {id: separate-muse, kind: separate, pm: muse-glimmer, orchestrator: muse-glimmer,
     engineer: muse-glimmer}
  # Conditional: runs only once llama-3-2-3b is approved, preflighted and served.
  - {id: separate-llama-pm, kind: separate, pm: llama-3-2-3b, orchestrator: muse-glimmer,
     engineer: muse-glimmer, conditional: true}
