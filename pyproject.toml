[project]
name = "axiom-earthlab"
version = "0.1.0"
description = "Evidence-first scientific investigation agent on Meta open-weight models, with deterministic claim verification."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Yatharth Mahesh Sant", email = "ysant77@gmail.com" }]
dependencies = [
    "httpx>=0.27",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "prometheus-client>=0.21",
    "pydantic>=2.8",
    "pyproj>=3.7",
    "pyyaml>=6.0",
    "tifffile>=2024.8",
    "tzdata>=2024.1",  # IANA zones for zoneinfo on Windows, which has no system database
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
acquire = ["earthengine-api>=1.0", "cdsapi==0.7.7"]
# GRIB reading for the haze ERA5 extract; eccodeslib bundles the ecCodes C library.
haze = ["eccodes==2.50.0", "eccodeslib==2.50.0.33"]
# HDF5 reading for the M5 satellite products (SMAP, IMERG, MAIAC after conversion).
m5 = ["h5py>=3.11", "tifffile>=2024.8", "imagecodecs>=2024.6", "scikit-learn>=1.5", "scipy>=1.13"]
# Experimental A2A adapter around the bounded engineer; see earthlab.a2a.
a2a = ["a2a-sdk[http-server]==1.2.2", "uvicorn>=0.30"]

[project.scripts]
earthlab = "earthlab.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earthlab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011", "PT018"]

[tool.mypy]
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "streamlit", "streamlit.*", "matplotlib", "matplotlib.*", "ee", "ee.*", "cdsapi", "cdsapi.*", "eccodes", "eccodes.*", "h5py", "h5py.*", "tifffile", "tifffile.*", "sklearn", "sklearn.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --cov=earthlab --cov-branch --cov-report=term-missing --cov-fail-under=85 -m \"not live\""
testpaths = ["tests"]
markers = ["live: needs a running Meta model endpoint (deselected in CI)"]

[tool.coverage.run]
omit = ["src/earthlab/ui/*"]
