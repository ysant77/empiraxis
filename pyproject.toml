[project]
name = "axiom-earthlab"
version = "0.1.0"
description = "Evidence-first scientific investigation agent on Meta open-weight models, with deterministic claim verification."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Yatharth Mahesh Sant", email = "ysant77@gmail.com" }]
dependencies = [
    "httpx>=0.27",
    "matplotlib>=3.9",
    "prometheus-client>=0.21",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "tzdata>=2024.1",  # IANA zones for zoneinfo on Windows, which has no system database
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
acquire = ["earthengine-api>=1.0"]

[project.scripts]
earthlab = "earthlab.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earthlab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011", "PT018"]

[tool.mypy]
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["streamlit", "streamlit.*", "matplotlib", "matplotlib.*", "ee", "ee.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --cov=earthlab --cov-branch --cov-report=term-missing --cov-fail-under=85 -m \"not live\""
testpaths = ["tests"]
markers = ["live: needs a running Meta model endpoint (deselected in CI)"]

[tool.coverage.run]
omit = ["src/earthlab/ui/*"]
